name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: password
        expose:
          - 3306
        options: --health-cmd "mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        expose:
          - 5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mongodb:
        image: mongo
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: password
        expose:
          - 27017
      memcached:
        image: memcached
        expose:
          - 11211
      redis:
        image: redis
        expose:
          - 6379
        options: --entrypoint redis-server

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]
        mapper: [mysql, pgsql]

    name: Unit tests PHP ${{ matrix.php }} and ${{ matrix.mapper }} 

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug
          extensions: redis

      - name: Override composer json file
        run: | 
          cp composer.$(echo ${{ matrix.mapper }} ).json composer.json

      - name: Install DB Client
        run: apt-get update && apt-get install mysql-client postgresql-client-16 -y

      - name: Install dependencies
        run: composer install

      - name: Load Mysql database
        run: | 
          mysql -uroot -hmysql -ppassword < vendor/linna/db-dumps/src/linna_db_mysql_test.sql
          mysql -uroot -hmysql -ppassword -e "SELECT user_id,name from linna_db.user"

      - name: Load Postgres database
        run: | 
          PGPASSWORD=password psql -U postgres -hpostgres -a -f vendor/linna/db-dumps/src/linna_db_pgsql_test.sql
          PGPASSWORD=password psql -U postgres -hpostgres -d linna_db -c "SELECT user_id, name from public.user"

      - name: Override phpunit conf
        run: | 
          mv phpunit.gitea.xml phpunit.xml

      - name: Execute tests
        run: vendor/bin/phpunit
  
  static-analysis:
    runs-on: ubuntu-latest

    needs:
      - tests

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]

    name: Code analysis with PHPStan PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        run: composer install

      - name: Execute PHPStan analysis
        if: always()
        run: vendor/bin/phpstan --xdebug analyze src --level 8